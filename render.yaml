databases:
  - name: rydio-db
    databaseName: rydio
    user: rydio
    plan: free
    region: frankfurt

services:
  - type: web
    name: rydio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rydio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
